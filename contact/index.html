<head>

<style>
html {
  font-family: monospace;
  font-size: 1.1rem;
  line-height: 1.3;
  color: #444;
  background: #DDE;
}
body {
  margin: 0 auto;
  padding: 20px;
  max-width: 800px;
}
header {
  width: 66%;
  margin-bottom: 30px;
  padding-bottom: 5px;
  color: #99B;
  border-bottom: 2px solid #BBD;
}
header a {
  color: #99B;
  text-decoration: none;
  text-transform: uppercase;
}
footer {
  width: 66%;
  margin-top: 30px;
  margin-left: 33%;
  padding-top: 5px;
  color: #99B;
  text-align: right;
  border-top: 2px solid #BBD;
}
footer a {
  color: #99B;
  text-decoration: none;
}
h1, h2, h3, h4, h5, h6 {
  margin-top: 40px;
  font-size: 1.1rem; 
  text-transform: uppercase;
}
h1, h2, h3, h4, h5, h6, b, i, strong, em {
  color: #000;
}
h1 { margin: 0; font-size: 1.2rem; }
time { font-size: 0.9rem; color: #888; }
a { color: #44B; }
li { margin: 0.5rem 0; }
pre code {
  display: block;
  padding: 10px 30px;
  color: #CCC;
  background: #111;
  border-radius: 12px;
  overflow: auto;
}
img {
  max-width: 100%;
  border: none;
  border-radius: 12px;
}
#email label {
  color: #44B;
  text-decoration: underline;
  cursor: pointer;
}
#email i { display: none; }
#email input[type=checkbox] { display: none; }
#email :checked ~ label { display: none; }
#email :checked ~ i:nth-child(odd) { display: inline; }
</style>

        </span>
